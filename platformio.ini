[platformio]
default_envs = esp32-c3-ears

[env:esp32-c3-ears]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
build_src_filter = +<*>

monitor_speed = 115200
upload_port = /dev/esp32-ears
monitor_port = /dev/esp32-ears

board_build.filesystem = littlefs
board_build.partitions = partitions_ears.csv

build_flags =
    -D EARS_INTEGRATED_BRIDGE=1
    ; Set to 0 to remove microphone level/error summaries (every 5 seconds).
    -D EARS_MIC_DIAGNOSTICS=1
    ; Set to 0 to compile out UART timing measurements and summaries.
    -D EARS_UART_DIAGNOSTICS=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D DEVICE_NAME=\"EARS\"
    -D DEVICE_MAC=\"10:b4:1d:15:9f:9c\"

; Maintenance firmware only. Restore esp32-c3-ears to resume audio capture.
[env:esp32-c3-core-bridge]
extends = env:esp32-c3-ears
build_src_filter = -<*> +<bridge/main.cpp>
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=0
